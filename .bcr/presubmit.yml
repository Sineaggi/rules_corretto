matrix:
  platform: ["debian11", "macos", "ubuntu2004", "windows"]
  bazel: [7.x, 8.x, 9.x]
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - "@rules_corretto//corretto/..."
bcr_test_module:
  module_path: "examples"
  matrix:
    platform: ["debian11", "macos", "ubuntu2004", "windows"]
    bazel: [7.x, 8.x, 9.x]
  tasks:
    run_test_module:
      name: Run example
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      run_targets:
        - "//:hello"
